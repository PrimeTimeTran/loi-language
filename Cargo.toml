[package]
name = "loi"
version = "0.0.1"
edition = "2024"

[dependencies]
# --- CLI & User Experience ---
clap = { version = "4", features = ["derive"] }
console = "0.15"
indicatif = "0.17"
owo-colors = "4"
dialoguer = "0.11"

# --- Error Handling & Diagnostics ---
anyhow = "1"
thiserror = "1"
miette = { version = "7", features = ["fancy"] }
ariadne = "0.5"

# --- Lexing & Parsing ---
logos = "0.14"
chumsky = "0.10"

# --- Compiler Core & Data Structures ---
bitflags = "2"
bumpalo = "3"
id-arena = "2"
lasso = "0.7"
petgraph = "0.6"
smallvec = "1"

# --- IR, Backend & Caching ---
bincode = "1"
inkwell = { version = "0.4", features = ["llvm17-0"] }
notify = "6"
serde = { version = "1", features = ["derive"] }

# --- Filesystem & Discovery ---
ignore = "0.4"
walkdir = "2"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.12.0"
tempfile = "3"
salsa = "0.27.0"
pretty_assertions = "1"
tabled = "0.21.0"
colored = "3.1.1"
clearscreen = "4.0.6"
rustyline = "18.0.0"
dyn-clone = "1.0.20"
dirs = "6.0.0"
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"
tempfile = "3"

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false

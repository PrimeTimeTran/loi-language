[package]
name = "vfs"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0.150"
# serde_json = "1"
async-trait = "0.1.89"
js-sys = "0.3.102"
futures = "0.3.32"
web-sys = { version = "0.3", features = ["console"] }


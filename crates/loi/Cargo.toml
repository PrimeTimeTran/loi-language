[package]
name = "loi"
description = "Loi programming language"
version = "0.0.1"
edition = "2024"

[lib]
name = "loi"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
snapshotting = []

[dependencies]
uuid = { version = "1", features = ["v4"] }
insta = { version = "1", features = ["yaml"] }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
derivative = "2.2"
console = "0.15"
indicatif = "0.17"
owo-colors = "4"
dialoguer = "0.11"
anyhow = "1"
thiserror = "1"
ariadne = "0.5"
logos = "0.14"
chumsky = "0.10"
bitflags = "2"
bumpalo = "3"
id-arena = "2"
lasso = "0.7"
petgraph = "0.6"
smallvec = "1"
bincode = "1"
notify = "6"
ignore = "0.4"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.12.0"
tempfile = "3"
salsa = "0.27.0"
pretty_assertions = "1"
tabled = "0.21.0"
colored = "3.1.1"
clearscreen = "4.0.6"
rustyline = "18.0.0"
dyn-clone = "1.0.20"
dirs = "6.0.0"
tower-lsp = "0.20.0"
regex = "1.12.4"
either = "1.16.0"
wasm-bindgen = "0.2.125"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1"
tempfile = "3"


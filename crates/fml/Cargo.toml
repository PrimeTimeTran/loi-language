[package]
name = "fml"
description = "Flow Modeling Language (FML)"
version = "0.1.0"
edition = "2024"

[dependencies]
# loi = { path = "../loi" }

walkdir = "2"
quote = "1.0.45"
prettyplease = "0.2"

clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "visit"] }
regex-syntax = { version = "0.8", features = ["std"] }

swc_core = { version = "70.0.0", features = ["common", "ecma_parser", "ecma_visit", "ecma_ast"] }
regex = "1.12.4"

